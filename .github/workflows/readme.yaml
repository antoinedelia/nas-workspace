name: Update README

on:
  pull_request:
    paths:
      - docker-compose/**
      - scripts/generate_readme_tables.py
      - README.md

permissions:
  contents: write

jobs:
  readme:
    # Forked PRs get a read-only token, so they cannot be pushed to.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run tests
        run: uv run --with pytest --with pyyaml python -m pytest tests

      - name: Regenerate README tables
        run: uv run scripts/generate_readme_tables.py

      - name: Commit and push if README changed
        run: |
          if git diff --quiet README.md; then
            echo "README.md is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README stacks table"
          git push
